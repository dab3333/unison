app = "unison-server"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  TRUST_PROXY = "true"
  CLIENT_ORIGIN = "https://YOUR-CLIENT-DOMAIN"

# Rooms live in memory: run exactly ONE machine. Scaling out needs the Redis work listed out of scope in the spec.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
